name: Build CV

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: CV.tex

      - name: Prepare website
        run: |
          mkdir -p public
          cp CV.pdf public/CV.pdf

          cat > public/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>CV</title>
          </head>
          <body>
            <h1>My CV</h1>
            <p><a href="CV.pdf">View CV</a></p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
